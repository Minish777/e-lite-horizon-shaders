schema = 1
id = "e_lite_horizon"
name = "E-LITE (Horizon port)"
version = "1.0.0"
api = "0.1"
description = "Unofficial port of E-LITE shaders (MakeUp Ultra Fast edit, v5.1.3) to Horizon's WGSL shader API. Colored shadows, godrays, bloom, AO, water reflections and refraction, waving, volumetric-style clouds, stars, aurora, LabPBR, and E-LITE's own settings and color schemes. Medium profile by default."
authors = ["EntokitoDezonze (original E-LITE)", "Javier Garduno (MakeUp Ultra Fast)"]
license = "LGPL-3.0"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "E-LITE sky"
clouds = false
stars = false
sun = false

[material]
file = "material.wgsl"
name = "E-LITE lighting"

[vertex]
file = "vertex.wgsl"

[weather]
file = "weather.wgsl"

[shadow]
resolution = 2048
distance = 128.0

[reflection]
option = "reflections"

[[materials]]
id = 1
sprites = ["block/*_leaves"]

[[materials]]
id = 2
sprites = [
    "block/short_grass", "block/short_dry_grass", "block/tall_dry_grass", "block/fern", "block/bush",
    "block/dead_bush", "block/firefly_bush", "block/*_sapling", "block/dandelion", "block/poppy",
    "block/blue_orchid", "block/allium", "block/azure_bluet", "block/*_tulip", "block/oxeye_daisy",
    "block/cornflower", "block/lily_of_the_valley", "block/wither_rose", "block/torchflower",
    "block/vine", "block/cave_vines*", "block/weeping_vines*", "block/twisting_vines*",
    "block/wheat_stage*", "block/carrots_stage*", "block/potatoes_stage*", "block/beetroots_stage*",
]

[[post]]
file = "post/atmosphere.wgsl"
name = "AO and atmosphere"

[[post]]
file = "post/godray_march.wgsl"
name = "God rays"
output = "godray_raw"
scale = 0.5

[[post]]
file = "post/godray_blur.wgsl"
name = "God ray blur"
output = "godray"
scale = 0.5

[[post]]
file = "post/bloom_down.wgsl"
name = "Bloom prefilter"
output = "bloom_half"
scale = 0.5

[[post]]
file = "post/bloom_blur.wgsl"
name = "Bloom blur"
output = "bloom_quarter"
scale = 0.25

[[post]]
file = "post/taa.wgsl"
name = "Temporal anti-aliasing"

[[post]]
file = "post/composite.wgsl"
name = "Composite"

[[lights]]
color = [0.3, 0.7, 1.0]
blocks = ["soul_*"]

[[lights]]
color = [1.0, 0.2, 0.1]
blocks = ["redstone_*"]

[[lights]]
color = [0.8, 0.9, 1.0]
blocks = ["sea_lantern", "end_rod"]

[[lights]]
color = [1.0, 0.62, 0.28]
blocks = ["torch", "wall_torch", "lantern", "campfire", "fire", "lava", "glowstone", "shroomlight", "jack_o_lantern"]

[[pages]]
id = "main"
name = "E-LITE"
items = ["page:basic", "page:lighting", "page:effects", "page:water", "page:sky", "page:camera", "debug_view", ""]

[[pages]]
id = "basic"
name = "Basic"
items = ["quality_profile", "color_scheme", "waving", "wind_force", "reflections", "refraction", "emissive_strength", ""]

[[pages]]
id = "lighting"
name = "Lighting"
items = ["shadow_strength", "shadow_softness", "ambient_level", "ao_strength", "night_bright", "avoid_dark", "blocklight_warmth", "torch_flicker", ""]

[[pages]]
id = "effects"
name = "Effects"
items = ["godray_amount", "sun_shafts", "glow_amount", "bloom_amount", "fog_amount", "fog_adjust", "morning_mist", "rain_puddles", "rain_opacity", ""]

[[pages]]
id = "water"
name = "Water"
items = ["wave_strength", "water_clarity", "water_absorption", "caustics_intensity", ""]

[[pages]]
id = "sky"
name = "Sky"
items = ["clouds", "cloud_amount", "stars", "stars_brightness", "stars_coverage", "aurora", "sky_warmth", "night_sky", ""]

[[pages]]
id = "camera"
name = "Camera"
items = ["tonemapping", "grade_strength", "exposure", "brightness", "contrast", "gamma", "saturation", "vibrance", "sharp_force", "dof_strength", "chromatic_aberration", "film_grain", "vignette", "cave_exposure", "taa", "lens_streak", "letterbox", ""]

[[options]]
id = "quality_profile"
name = "Profile (ACERCADE)"
description = "E-LITE quality profile. Medium is the recommended default. Higher profiles strengthen bloom, god rays, AO and fog; shadow map size is fixed at Medium."
type = "choice"
values = ["No effects", "Very low", "Low", "Medium", "High", "Max"]
default = "Medium"

[[options]]
id = "color_scheme"
name = "Color scheme"
description = "E-LITE COLOR_SCHEME / STYLE."
type = "choice"
values = ["Vanilla", "Realistic+", "LITE Legacy", "Warm film", "Vivid"]
default = "Realistic+"

[[options]]
id = "waving"
name = "Waving"
description = "Leaves and plants sway in the wind. E-LITE WAVING."
type = "bool"
default = true

[[options]]
id = "wind_force"
name = "Wind force"
description = "E-LITE WIND_FORCE."
type = "float"
default = 1.0
min = 0.0
max = 4.0
step = 0.25

[[options]]
id = "reflections"
name = "Water reflections"
description = "E-LITE REFLECTION_SLIDER (planar reflection texture)."
type = "bool"
default = true

[[options]]
id = "refraction"
name = "Refraction"
description = "Placeholder kept for E-LITE parity: water refraction is always on in this port."
type = "bool"
default = true

[[options]]
id = "emissive_strength"
name = "Emissive strength"
description = "E-LITE EMISSIVE_ORE / EMISSIVE_MATERIAL brightness."
type = "float"
default = 1.0
min = 0.0
max = 3.0
step = 0.05


[[options]]
id = "shadow_strength"
name = "Shadow strength"
description = "How dark sun and moon shadows are."
type = "float"
default = 0.85
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "shadow_softness"
